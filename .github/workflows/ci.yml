name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Check PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l

  phpcs:
    name: PHP code standards
    runs-on: ubuntu-latest
    env:
      # Report-only while the existing issues from the original plugin are fixed.
      # Set to 'true' to make this check fail the build again.
      PHPCS_BLOCKING: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer, cs2pr
      - name: Install PHP tools
        run: composer update --no-interaction --no-progress
      - name: Run PHPCS
        run: |
          set -o pipefail
          if vendor/bin/phpcs -q --report=checkstyle | cs2pr; then
            echo "No PHPCS issues found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### PHPCS issues"
            echo '```'
            vendor/bin/phpcs -q --report=summary --no-colors || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PHPCS_BLOCKING" = "true" ]; then
            exit 1
          fi
          echo "::warning::PHPCS found issues but is in report-only mode (PHPCS_BLOCKING=false)."

  js-css:
    name: JavaScript & CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - name: Lint JavaScript
        run: npm run lint:js
      - name: Lint CSS
        run: npm run lint:css

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gettext
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext
      - name: Check .po and .mo files
        run: bin/check-translations.sh
